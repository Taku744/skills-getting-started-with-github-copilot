<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .session-type {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background: #667eea;
            color: white;
        }

        .btn-start:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-pause {
            background: #ffa500;
            color: white;
        }

        .btn-pause:hover {
            background: #ff8c00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .settings {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .settings h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .setting-group {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 15px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setting-item input {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .setting-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .stats p {
            color: #666;
            margin: 5px 0;
            font-size: 14px;
        }

        .stats span {
            font-weight: bold;
            color: #667eea;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .timer-display.active {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 ポモドーロタイマー</h1>
        <div class="session-type" id="sessionType">作業時間</div>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTimer()">開始</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>一時停止</button>
            <button class="btn-reset" id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>

        <div class="settings">
            <h3>タイマー設定</h3>
            <div class="setting-group">
                <div class="setting-item">
                    <label for="workDuration">作業時間（分）</label>
                    <input type="number" id="workDuration" min="1" max="60" value="25" onchange="updateSettings()">
                </div>
                <div class="setting-item">
                    <label for="breakDuration">休憩時間（分）</label>
                    <input type="number" id="breakDuration" min="1" max="30" value="5" onchange="updateSettings()">
                </div>
            </div>
        </div>

        <div class="stats">
            <p>完了したセッション: <span id="completedSessions">0</span></p>
            <p>今日の総作業時間: <span id="totalWorkTime">0</span> 分</p>
        </div>
    </div>

    <script>
        // タイマーの状態を管理するオブジェクト
        const timer = {
            isRunning: false,
            isWorkSession: true,
            timeLeft: 25 * 60, // 秒単位
            totalTime: 25 * 60,
            workDuration: 25 * 60,
            breakDuration: 5 * 60,
            intervalId: null,
            completedSessions: 0,
            totalWorkTime: 0
        };

        // DOMの初期化
        function initializeDOM() {
            updateDisplay();
        }

        // タイマーの表示を更新
        function updateDisplay() {
            const minutes = Math.floor(timer.timeLeft / 60);
            const seconds = timer.timeLeft % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = timeStr;

            // プログレスバーを更新
            const progress = ((timer.totalTime - timer.timeLeft) / timer.totalTime) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // セッションタイプを更新
            const sessionTypeElement = document.getElementById('sessionType');
            if (timer.isWorkSession) {
                sessionTypeElement.textContent = '作業時間';
                sessionTypeElement.style.color = '#667eea';
            } else {
                sessionTypeElement.textContent = '休憩時間';
                sessionTypeElement.style.color = '#2ecc71';
            }
        }

        // タイマーを開始
        function startTimer() {
            if (timer.isRunning) return;

            timer.isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;

            timer.intervalId = setInterval(() => {
                timer.timeLeft--;

                if (timer.timeLeft <= 0) {
                    completeSession();
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        // タイマーを一時停止
        function pauseTimer() {
            if (!timer.isRunning) return;

            timer.isRunning = false;
            clearInterval(timer.intervalId);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        // タイマーをリセット
        function resetTimer() {
            pauseTimer();
            timer.timeLeft = timer.isWorkSession ? timer.workDuration : timer.breakDuration;
            timer.totalTime = timer.timeLeft;
            updateDisplay();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        // セッション完了時の処理
        function completeSession() {
            clearInterval(timer.intervalId);
            timer.isRunning = false;

            // 音声通知（ブラウザが対応している場合）
            playNotification();

            if (timer.isWorkSession) {
                timer.completedSessions++;
                timer.totalWorkTime += timer.workDuration / 60;
                document.getElementById('completedSessions').textContent = timer.completedSessions;
                document.getElementById('totalWorkTime').textContent = Math.round(timer.totalWorkTime);

                // 休憩時間に切り替え
                timer.isWorkSession = false;
                timer.timeLeft = timer.breakDuration;
                timer.totalTime = timer.breakDuration;
                alert('作業時間が終了しました。休憩しましょう！');
            } else {
                // 作業時間に切り替え
                timer.isWorkSession = true;
                timer.timeLeft = timer.workDuration;
                timer.totalTime = timer.workDuration;
                alert('休憩時間が終了しました。次のセッションを開始できます。');
            }

            updateDisplay();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        // 設定を更新
        function updateSettings() {
            const workDuration = parseInt(document.getElementById('workDuration').value) || 25;
            const breakDuration = parseInt(document.getElementById('breakDuration').value) || 5;

            timer.workDuration = workDuration * 60;
            timer.breakDuration = breakDuration * 60;

            if (!timer.isRunning) {
                resetTimer();
            }
        }

        // 音声通知を再生
        function playNotification() {
            if ('AudioContext' in window || 'webkitAudioContext' in window) {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = 1000; // Hz
                    oscillator.type = 'sine';

                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.log('Audio notification not available');
                }
            }
        }

        // ページ読み込み時に初期化
        window.addEventListener('load', initializeDOM);
    </script>
</body>
</html>
